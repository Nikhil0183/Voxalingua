<!DOCTYPE html>
<html>
<head>
  <title>Conversation Mode</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      background:#0b0b12;
      color:white;
      font-family:Arial;
      text-align:center;
      padding:30px;
    }

    button{
      width:100%;
      padding:18px;
      margin-top:15px;
      font-size:18px;
      border:none;
      border-radius:30px;
      background:#6a00ff;
      color:white;
    }

    select{
      width:100%;
      padding:10px;
      margin-top:10px;
      background:#151521;
      color:white;
    }
  </style>
</head>

<body>

<h2>💬 Conversation Mode</h2>

<select id="langA">
  <option value="hi-IN">Hindi</option>
  <option value="en-US">English</option>
</select>

<select id="langB">
  <option value="en-US">English</option>
  <option value="hi-IN">Hindi</option>
</select>

<button onclick="speakA()">🎤 Person A Speak</button>
<button onclick="speakB()">🎤 Person B Speak</button>

<button onclick="location.href='index.html'">⬅ Back</button>

<script src="conversation.js"></script>

</body>
</html>
